<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STARS — Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #060c2e; }
    .card { background: rgba(10,16,60,0.95); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 40px; width: min(440px, calc(100vw - 32px)); }
    h2 { color: #EE781C; font-size: 28px; margin-bottom: 8px; }
    p { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 24px; }
    label { display: block; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
    input { width: 100%; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.1); border-radius: 10px; color: #fff; font-family: inherit; font-size: 14px; padding: 12px 14px; outline: none; margin-bottom: 16px; }
    button { width: 100%; background: linear-gradient(135deg, #EE781C, #FF9840); color: #fff; border: none; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 800; padding: 13px; cursor: pointer; letter-spacing: 1px; }
    .msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <h2>★ STARS</h2>
    <p>Enter your new password below.</p>
    <label>New Password</label>
    <input type="password" id="newPassword" placeholder="Min. 6 characters"/>
    <label>Confirm Password</label>
    <input type="password" id="confirmPassword" placeholder="Re-enter password"/>
    <button onclick="resetPassword()">Reset Password</button>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    async function resetPassword() {
      const token = new URLSearchParams(window.location.search).get('token');
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const msgEl = document.getElementById('msg');
      if (!token) { msgEl.className = 'msg error'; msgEl.textContent = 'Invalid reset link.'; return; }
      if (newPassword.length < 6) { msgEl.className = 'msg error'; msgEl.textContent = 'Password must be at least 6 characters.'; return; }
      if (newPassword !== confirmPassword) { msgEl.className = 'msg error'; msgEl.textContent = 'Passwords do not match.'; return; }
      const res = await fetch('https://stars-backend-1.onrender.com/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword })
      });
      const data = await res.json();
      if (data.success) {
        msgEl.className = 'msg success';
        msgEl.textContent = '✓ Password reset! Redirecting to login...';
        setTimeout(() => window.location.href = 'index.html', 2000);
      } else {
        msgEl.className = 'msg error';
        msgEl.textContent = data.message || 'Error. Try again.';
      }
    }
  </script>
</body>
</html>
